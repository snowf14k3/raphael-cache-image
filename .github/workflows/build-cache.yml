name: Build Debian 13 Raphael boot components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Debian 13 ARM64
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash scripts/build-cache.sh
      - name: Upload EFI, initramfs and matching kernel package
        uses: actions/upload-artifact@v4
        with:
          name: raphael-bootfix-c0d0-debian13
          path: |
            out/linux.efi
            out/initramfs
            out/sm8150-xiaomi-raphael.dtb
            out/linux-image-*.deb
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
